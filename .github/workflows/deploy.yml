# Deploy del sitio a GitHub Pages.
#
# Se dispara con cada push a `main`, lo que incluye el merge de cualquier PR.
# `main` es la rama de produccion: lo que llega aca lo ven los clientes, sin
# staging intermedio. Se trabaja en ramas feat/* y se mergea por PR.
#
# Vuelta atras: Actions > Deploy > Run workflow, con el SHA de un commit bueno
# en `ref` (o revertir el commit en `main`). Se recompila ese commit.
name: Deploy (rama main)

on:
  push:
    branches: ['main']
    # Solo documentacion: no hace falta recompilar. OJO: no ignorar '**/*.md',
    # el catalogo vive en src/content/**/*.md.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'TAREAS.md'
      - 'recursos/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      ref:
        description: 'SHA, rama o etiqueta a publicar (vacio: main)'
        required: false
        default: ''

# Dos deploys simultaneos se pisarian. Sin cancel-in-progress: cortar a mitad
# de la publicacion deja el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Las redirecciones de modelos renombrados salen del historial de git.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Un build vacio o a medias no se publica.
      - name: El build genero el sitio
        run: test -s dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar desde fuera
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://batas.ubbedigital.com' }}
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            if [ "$CODE" = "200" ]; then echo "El sitio responde 200 (intento $i)"; exit 0; fi
            sleep 3
          done
          echo "El sitio no respondio 200 tras 30s (ultimo codigo: $CODE)" >&2
          exit 1
