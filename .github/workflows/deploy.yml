# Deploy del sitio a GitHub Pages.
#
# Se dispara con cada push a `main`, lo que incluye el merge de cualquier PR.
# `main` es la rama de produccion: lo que llega aca lo ven los clientes, sin
# staging intermedio. Se trabaja en ramas feat/* y se mergea por PR.
#
# Vuelta atras: Actions > Deploy > Run workflow, con el SHA de un commit bueno
# en `ref` (o revertir el commit en `main`). Se recompila ese commit.
name: Deploy (rama main)

on:
  push:
    branches: ['main']
    # Solo documentacion: no hace falta recompilar. OJO: no ignorar '**/*.md',
    # el catalogo vive en src/content/**/*.md.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'TAREAS.md'
      - 'recursos/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      ref:
        description: 'SHA, rama o etiqueta a publicar (vacio: main)'
        required: false
        default: ''

# Dos deploys simultaneos se pisarian. Sin cancel-in-progress: cortar a mitad
# de la publicacion deja el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Las redirecciones de modelos renombrados salen del historial de git.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Un build vacio o a medias no se publica.
      - name: El build genero el sitio
        run: test -s dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verificar desde fuera
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://batas.ubbedigital.com' }}
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            if [ "$CODE" = "200" ]; then echo "El sitio responde 200 (intento $i)"; exit 0; fi
            sleep 3
          done
          echo "El sitio no respondio 200 tras 30s (ultimo codigo: $CODE)" >&2
          exit 1

  # Aviso al telefono por el ntfy propio (Ubbe-Digital/notifier, tema sys-deploys):
  # exito con prioridad 2 (silencioso), fallo con prioridad 4 y enlace a esta
  # ejecucion. Job aparte con if: always(): avisa aunque un job anterior falle o
  # ni llegue a correr. Sin el secreto NTFY_DEPLOYS_TOKEN no hace nada.
  avisar:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Avisar resultado
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_DEPLOYS_TOKEN }}
          FALLO: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          SISTEMA: MAKK Batas (web)
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOKEN" ] || { echo "sin NTFY_DEPLOYS_TOKEN: no se avisa"; exit 0; }
          if [ "$FALLO" = true ]; then
            prio=4; tag=x; estado="deploy fallido"
          else
            prio=2; tag=white_check_mark; estado="deploy OK"
          fi
          # Qué se desplegó: el título del PR si es un merge, si no el asunto del commit.
          # El sistema va en el título y en el cuerpo: según el teléfono, una
          # notificación silenciosa o agrupada muestra solo una de las dos líneas.
          asunto=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          case "$asunto" in
            "Merge pull request #"*)
              pr=$(printf '%s\n' "$asunto" | grep -o '#[0-9]*' | head -n 1)
              titulo_pr=$(printf '%s\n' "$COMMIT_MSG" | sed -n '3p')
              [ -z "$titulo_pr" ] || asunto="$titulo_pr ($pr)" ;;
            "") asunto="lanzado a mano" ;;
          esac
          curl -fsS --max-time 15 -o /dev/null \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: $SISTEMA: $estado" -H "Priority: $prio" -H "Tags: $tag" -H "Click: $URL_RUN" \
            --data-binary "$SISTEMA · $asunto · ${GITHUB_SHA::7} por $GITHUB_ACTOR" \
            https://push.ubbedigital.com/sys-deploys \
            || echo "no se pudo avisar: ntfy no respondio"
