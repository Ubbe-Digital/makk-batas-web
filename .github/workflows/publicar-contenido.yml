# Publica los cambios que Makk hace desde Pages CMS.
#
# Pages CMS escribe en la rama `contenido`, nunca en `main`. Cada push a esa
# rama se fusiona en `main` solo si el sitio compila con los cambios; asi un
# campo faltante o una foto inexistente no llegan a produccion. Si falla, `main`
# queda intacta y se abre un issue.
#
# Los pushes hechos con GITHUB_TOKEN no disparan otros workflows, por eso el
# deploy se lanza a mano al final (workflow_dispatch si esta permitido).
name: Publicar contenido (rama contenido)

on:
  push:
    branches: ['contenido']

# Un solo publicador a la vez: dos fusiones simultaneas se pisarian en `main`.
concurrency:
  group: publicar-contenido
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Identidad de git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Hay algo que publicar?
        id: pendiente
        run: |
          if [ "$(git rev-list --count main..origin/contenido)" -eq 0 ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Fusionar contenido en main (local, sin subir todavia)
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          git merge --no-ff origin/contenido -m 'catalogo: publica los cambios del CMS'

      - uses: actions/setup-node@v4
        if: steps.pendiente.outputs.hay == 'si'
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias
        if: steps.pendiente.outputs.hay == 'si'
        run: npm ci

      # Pages CMS no puede subir a la carpeta de cada modelo: las deja sueltas.
      - name: Ordenar fotos por modelo
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          node scripts/ordenar-fotos.mjs
          if [ -n "$(git status --porcelain src)" ]; then
            git add -A src
            git commit -m 'catalogo: ordena las fotos por modelo'
          fi

      - name: Reducir fotos a 2000 px
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          node scripts/reducir-fotos.mjs
          if [ -n "$(git status --porcelain src/assets)" ]; then
            git add src/assets
            git commit -m 'catalogo: reduce las fotos nuevas a 2000 px'
          fi

      - name: Tipos (astro check)
        if: steps.pendiente.outputs.hay == 'si'
        run: npm run check

      - name: Build
        if: steps.pendiente.outputs.hay == 'si'
        run: npm run build

      - name: El build genero el sitio
        if: steps.pendiente.outputs.hay == 'si'
        run: test -s dist/index.html

      - name: Subir a main y lanzar el deploy
        if: steps.pendiente.outputs.hay == 'si'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `main` puede avanzar mientras se valida (un PR fusionado a mano): el
          # push se rechaza. Se incorpora lo nuevo y se valida otra vez, hasta
          # 3 veces; un conflicto real falla el job y abre el issue.
          for intento in 1 2 3; do
            if git push origin HEAD:main; then publicado=si; break; fi
            echo "main avanzo (intento $intento): se incorpora y se valida de nuevo"
            git fetch origin main
            git merge origin/main -m 'catalogo: incorpora cambios recientes de main'
            npm run check
            npm run build
          done
          [ "${publicado:-no}" = si ] || { echo 'No se pudo subir a main' >&2; exit 1; }
          # Deja `contenido` al dia con main. Si Makk guardo algo mientras
          # tanto el push se rechaza y ese cambio entra en la siguiente corrida.
          git push origin HEAD:contenido || echo 'contenido avanzo: se publicara en la siguiente corrida'
          gh workflow run deploy.yml --ref main

      # Una publicacion que sale bien resuelve el fallo anterior: sus cambios
      # van incluidos, porque cada corrida fusiona todo `contenido`.
      - name: Cerrar el aviso de fallo anterior
        if: steps.pendiente.outputs.hay == 'si'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --search '"Fallo la publicacion del catalogo" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Publicado en la corrida siguiente: $RUN_URL"
          done

      - name: Avisar si fallo
        if: failure()
        run: |
          titulo='Fallo la publicacion del catalogo'
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existente=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "Volvio a fallar: $url"
          else
            gh issue create --title "$titulo" --body "Los cambios de la rama \`contenido\` no se publicaron: el sitio no compila con ellos o hay un conflicto con \`main\`. Detalle: $url"
          fi

      # Makk no tiene cuenta de GitHub y no ve el issue de arriba. Este paso le
      # escribe por correo. Queda inactivo mientras falte algun secreto del
      # repo (Settings > Secrets and variables > Actions):
      #   SMTP_URL    servidor, ej. smtps://smtp.ejemplo.com:465
      #               (o smtp://smtp.ejemplo.com:587 para STARTTLS)
      #   SMTP_USER   usuario del servidor
      #   SMTP_PASS   clave del servidor
      #   AVISO_DE    remitente, ej. avisos@ubbedigital.com
      #   AVISO_PARA  destinatarios separados por coma (Makk y Kevin)
      - name: Avisar por correo si fallo
        if: failure()
        continue-on-error: true
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AVISO_DE: ${{ secrets.AVISO_DE }}
          AVISO_PARA: ${{ secrets.AVISO_PARA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for v in SMTP_URL SMTP_USER SMTP_PASS AVISO_DE AVISO_PARA; do
            if [ -z "${!v}" ]; then
              echo "Falta el secreto $v: no se envia el correo."
              exit 0
            fi
          done

          mensaje=$(mktemp)
          cat > "$mensaje" <<MAIL
          From: Catalogo MAKK <$AVISO_DE>
          To: $AVISO_PARA
          Subject: Un cambio del catalogo no se publico
          MIME-Version: 1.0
          Content-Type: text/plain; charset=UTF-8
          Content-Transfer-Encoding: 8bit

          Hola,

          Un cambio que se guardó en el panel del catálogo no se pudo publicar en
          el sitio. No se perdió nada: lo guardado sigue en el panel y el sitio
          publicado se queda como estaba.

          Kevin ya fue avisado y lo revisa. No hace falta que hagas nada; si
          sigues editando, los nuevos cambios se publicarán junto con el pendiente
          cuando se resuelva.

          Detalle técnico (para Kevin): $RUN_URL
          MAIL
          # El heredoc va indentado para leerse dentro del YAML: se quita la sangria.
          sed -i 's/^          //' "$mensaje"

          args=()
          IFS=',' read -ra para <<< "$AVISO_PARA"
          for d in "${para[@]}"; do args+=(--mail-rcpt "$(echo "$d" | xargs)"); done

          curl --silent --show-error --fail --ssl-reqd \
            --url "$SMTP_URL" --user "$SMTP_USER:$SMTP_PASS" \
            --mail-from "$AVISO_DE" "${args[@]}" --upload-file "$mensaje"
          echo "Correo enviado a $AVISO_PARA"
