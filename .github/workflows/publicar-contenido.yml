# Publica los cambios que Makk hace desde Pages CMS.
#
# Pages CMS escribe en la rama `contenido`, nunca en `main`. Cada push a esa
# rama se fusiona en `main` solo si el sitio compila con los cambios; asi un
# campo faltante o una foto inexistente no llegan a produccion. Si falla, `main`
# queda intacta y se abre un issue.
#
# `main` esta protegido (ruleset "Proteger main": exige PR y el estado `build`),
# asi que la fusion va por un PR de rama temporal, no por push directo. Lo que
# hace GITHUB_TOKEN no dispara otros workflows (ni el CI del PR ni el deploy):
# el estado `build` lo publica este job tras validar, y el deploy se lanza a
# mano al final con workflow_dispatch.
#
# Requiere en Settings > Actions > General: "Allow GitHub Actions to create and
# approve pull requests".
name: Publicar contenido (rama contenido)

on:
  push:
    branches: ['contenido']

# Un solo publicador a la vez: dos fusiones simultaneas se pisarian en `main`.
concurrency:
  group: publicar-contenido
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Identidad de git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Hay algo que publicar?
        id: pendiente
        run: |
          if [ "$(git rev-list --count main..origin/contenido)" -eq 0 ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Fusionar contenido en main (local, sin subir todavia)
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          git merge --no-ff origin/contenido -m 'catalogo: publica los cambios del CMS'

      - uses: actions/setup-node@v7
        if: steps.pendiente.outputs.hay == 'si'
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias
        if: steps.pendiente.outputs.hay == 'si'
        run: npm ci

      # Pages CMS no puede subir a la carpeta de cada modelo: las deja sueltas.
      - name: Ordenar fotos por modelo
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          node scripts/ordenar-fotos.mjs
          if [ -n "$(git status --porcelain src)" ]; then
            git add -A src
            git commit -m 'catalogo: ordena las fotos por modelo'
          fi

      - name: Reducir fotos a 2000 px
        if: steps.pendiente.outputs.hay == 'si'
        run: |
          node scripts/reducir-fotos.mjs
          if [ -n "$(git status --porcelain src/assets)" ]; then
            git add src/assets
            git commit -m 'catalogo: reduce las fotos nuevas a 2000 px'
          fi

      - name: Tipos (astro check)
        if: steps.pendiente.outputs.hay == 'si'
        run: npm run check

      - name: Build
        if: steps.pendiente.outputs.hay == 'si'
        run: npm run build

      - name: El build genero el sitio
        if: steps.pendiente.outputs.hay == 'si'
        run: test -s dist/index.html

      - name: Publicar en main por PR y lanzar el deploy
        if: steps.pendiente.outputs.hay == 'si'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `main` esta protegido (ruleset): no admite push directo. Se publica
          # por un PR desde una rama temporal. Los PR creados con GITHUB_TOKEN no
          # disparan el CI, asi que el estado `build` que exige el ruleset lo
          # publica este job, despues de validar (astro check + build arriba).
          publicado=no
          for intento in 1 2 3; do
            # `main` puede avanzar mientras se valida (un PR fusionado a mano):
            # se incorpora y se valida otra vez. Un conflicto real falla el job
            # y abre el issue.
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main avanzo (intento $intento): se incorpora y se valida de nuevo"
              git merge origin/main -m 'catalogo: incorpora cambios recientes de main'
              npm run check
              npm run build
            fi

            rama="publicar/${GITHUB_RUN_ID}-${intento}"
            git push origin "HEAD:refs/heads/$rama"
            sha=$(git rev-parse HEAD)
            pr=$(gh pr create --base main --head "$rama" \
              --title 'catalogo: publica los cambios del CMS' \
              --body "Cambios de la rama \`contenido\`, validados (astro check y build) por $RUN_URL")
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=success -f context=build \
              -f description='Validado por publicar-contenido.yml' -f target_url="$RUN_URL"

            # GitHub tarda unos segundos en calcular si el PR se puede fusionar.
            for espera in 1 2 3 4 5 6; do
              if gh pr merge "$pr" --merge --delete-branch; then publicado=si; break; fi
              sleep 5
            done
            [ "$publicado" = si ] && break
            echo "No se pudo fusionar el PR (intento $intento)"
            gh pr close "$pr" --delete-branch || true
          done
          [ "$publicado" = si ] || { echo 'No se pudo publicar en main' >&2; exit 1; }

          # Deja `contenido` al dia con main. Si Makk guardo algo mientras
          # tanto el push se rechaza y ese cambio entra en la siguiente corrida.
          git fetch origin main
          git push origin origin/main:refs/heads/contenido || echo 'contenido avanzo: se publicara en la siguiente corrida'
          gh workflow run deploy.yml --ref main

      # Una publicacion que sale bien resuelve el fallo anterior: sus cambios
      # van incluidos, porque cada corrida fusiona todo `contenido`.
      - name: Cerrar el aviso de fallo anterior
        if: steps.pendiente.outputs.hay == 'si'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --search '"Fallo la publicacion del catalogo" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Publicado en la corrida siguiente: $RUN_URL"
          done

      - name: Avisar si fallo
        if: failure()
        run: |
          titulo='Fallo la publicacion del catalogo'
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existente=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "Volvio a fallar: $url"
          else
            gh issue create --title "$titulo" --body "Los cambios de la rama \`contenido\` no se publicaron: el sitio no compila con ellos o hay un conflicto con \`main\`. Detalle: $url"
          fi

      # Makk no tiene cuenta de GitHub y no ve el issue de arriba: el aviso va a
      # un chat de Telegram (grupo con Makk y Kevin). Queda inactivo mientras
      # falte algun secreto del repo (Settings > Secrets and variables > Actions):
      #   TELEGRAM_BOT_TOKEN  token que da @BotFather al crear el bot
      #   TELEGRAM_CHAT_ID    id del grupo (numero negativo)
      - name: Avisar por Telegram si fallo
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Faltan los secretos de Telegram: no se envia el aviso."
            exit 0
          fi
          texto=$(printf '%s\n\n%s\n\n%s' \
            "⚠️ Catálogo MAKK: un cambio guardado en el panel no se pudo publicar." \
            "No se perdió nada: lo guardado sigue en el panel y el sitio publicado se queda como estaba. Kevin ya fue avisado y lo revisa; no hace falta hacer nada." \
            "Detalle técnico (Kevin): $RUN_URL")
          curl --silent --show-error --fail \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$texto" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          echo "Aviso enviado a Telegram"
