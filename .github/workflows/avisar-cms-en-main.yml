# Avisa si alguien edita desde Pages CMS sobre `main` en vez de `contenido`.
#
# Este repo es privado en el plan gratuito de GitHub, que no permite proteger
# ramas. Pages CMS abre `main` por defecto, y un cambio ahi se salta el orden
# de fotos y la validacion de publicar-contenido.yml. Esto no lo impide: abre
# un issue para que Kevin mueva el cambio a `contenido`.
name: Avisar CMS sobre main

on:
  push:
    branches: ['main']

permissions:
  issues: write

jobs:
  avisar:
    # Los commits de Pages CMS terminan en "(via Pages CMS)". Solo se mira el
    # ultimo: un merge de PR cuyo historial incluya commits del CMS no avisa.
    if: endsWith(github.event.head_commit.message, '(via Pages CMS)')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Este job no hace checkout: sin esto `gh` falla con "not a git repository".
      GH_REPO: ${{ github.repository }}
      MENSAJE: ${{ github.event.head_commit.message }}
      COMMIT_URL: ${{ github.event.head_commit.url }}
    steps:
      - name: Abrir issue
        run: |
          titulo='Pages CMS escribio en main en vez de contenido'
          cuerpo=$(printf '%s\n\n%s\n\n%s' \
            "Un commit del CMS llego directo a \`main\`: $COMMIT_URL" \
            "Mensaje: $MENSAJE" \
            "Ese cambio no paso por la validacion ni por el orden de fotos de \`publicar-contenido.yml\`. Hay que moverlo a la rama \`contenido\` y pedir que el CMS se use ahi: https://app.pagescms.org/ubbe-digital/makk-batas/contenido")
          existente=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --body "$cuerpo"
          fi

      # Mismo chat de Telegram que publicar-contenido.yml; inactivo sin secretos.
      - name: Avisar por Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Faltan los secretos de Telegram: no se envia el aviso."
            exit 0
          fi
          texto=$(printf '%s\n\n%s\n\n%s' \
            "⚠️ Catálogo MAKK: un cambio del panel se guardó en la rama principal (main) en vez de contenido." \
            "Hay que entrar siempre por: https://app.pagescms.org/ubbe-digital/makk-batas/contenido" \
            "Detalle técnico (Kevin): $COMMIT_URL")
          curl --silent --show-error --fail \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$texto" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          echo "Aviso enviado a Telegram"
