# Verificacion de cada PR antes del merge.
#
# Compila el sitio igual que el deploy: un modelo mal cargado (sin foto, foto
# inexistente, categoria que no existe) rompe el esquema de las content
# collections y el PR queda en rojo antes de llegar a `main`.
name: CI

on:
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Los PR que abre publicar-contenido.yml (github-actions[bot]) ya se validan
    # ahi y publican el estado `build` ellos mismos; aqui terminaban en fallo
    # sin jobs ("workflow file issue"). Experimento: saltar el job en vez de
    # fallar. Si el fallo persiste, revertir.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Las redirecciones de modelos renombrados salen del historial de git.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Tipos (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: El build genero el sitio
        run: test -s dist/index.html
